<div class="tolla-layout">
  @if (isAuthenticated()) {
    <tolla-sidebar class="tolla-layout__sidebar" />
  }
  <div class="tolla-layout__main">
    <tolla-header
      class="tolla-layout__header"
      [userName]="userName()"
      [isAuthenticated]="isAuthenticated()"
      [resultCount]="resultCount()"
      (searchChanged)="onSearch($event)"
    />
    <main class="tolla-layout__content">
      <router-outlet />
    </main>
  </div>
  <tolla-login-modal />
</div>
