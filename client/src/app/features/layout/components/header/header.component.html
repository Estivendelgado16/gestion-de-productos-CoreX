<header class="tolla-header">
  <div class="tolla-header__brand">
    <span class="tolla-header__logo" aria-hidden="true">T</span>
    <div class="tolla-header__brand-text">
      <span class="tolla-header__name">TOLLA</span>
      <span class="tolla-header__sub">CATEGORY ADMIN</span>
    </div>
  </div>

  <div class="tolla-header__search">
    <svg
      class="tolla-header__search-icon"
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input
      class="tolla-header__search-input"
      type="search"
      placeholder="Search products, categories, nodes…"
      [formControl]="searchControl"
      aria-label="Global search"
    />
    @if (searchControl.value) {
      <button
        type="button"
        class="tolla-header__search-clear"
        (click)="clearSearch()"
        aria-label="Clear search"
      >
        ×
      </button>
    }
  </div>

  <div class="tolla-header__actions">
    @if (resultCount !== null) {
      <span class="tolla-header__count">{{ resultCount }} results</span>
    }
    <div class="tolla-header__user">
      <span class="tolla-header__avatar" aria-hidden="true">
        {{ userName.charAt(0).toUpperCase() || 'U' }}
      </span>
      <span class="tolla-header__username">{{ userName }}</span>
    </div>
    <button type="button" class="tolla-header__logout" (click)="onLogout()">
      Logout
    </button>
  </div>
</header>
