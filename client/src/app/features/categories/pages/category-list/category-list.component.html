<div class="tolla-page">
  <div class="tolla-page__head">
    <div>
      <h1 class="tolla-page__eyebrow">// CATEGORIES</h1>
      <p class="tolla-page__hint">{{ categories().length }} CATEGORIES</p>
    </div>
    <a routerLink="/categories/new" class="tolla-page__create">+ CREATE</a>
  </div>

  @if (success()) {
    <div class="tolla-page__success" role="status">{{ success() }}</div>
  }

  <tolla-category-grid
    [categories]="categories()"
    [loading]="loading()"
    [error]="loadError()"
    (categorySelected)="onCategoryEdit($event)"
    (categoryEdit)="onCategoryEdit($event)"
    (categoryDelete)="onCategoryDelete($event)"
    (createNode)="onCreate()"
  />
</div>
