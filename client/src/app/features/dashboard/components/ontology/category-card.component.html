<article class="tolla-cat" (click)="select()" [style.--tolla-cat-index]="index">
  <div class="tolla-cat__rail" aria-hidden="true"></div>

  <div class="tolla-cat__head">
    <span class="tolla-cat__code">NODE #{{ (index + 1).toString().padStart(2, '0') }}</span>
    <span class="tolla-cat__chevron" aria-hidden="true">›</span>
  </div>

  <h3 class="tolla-cat__name">{{ category.name }}</h3>

  <p class="tolla-cat__desc">
    {{ category.description || 'No description available for this node.' }}
  </p>

  <div class="tolla-cat__meta">
    <span class="tolla-cat__meta-item">
      <span class="tolla-cat__meta-label">UPDATED</span>
      <span class="tolla-cat__meta-value">{{ category.updatedAt | date: 'short' }}</span>
    </span>
    <button type="button" class="tolla-cat__edit" (click)="onEdit(); $event.stopPropagation()">
      Edit
    </button>
    <button type="button" class="tolla-cat__delete" (click)="onDelete(); $event.stopPropagation()">
      Delete
    </button>
  </div>
</article>
