<tolla-layout-container
  [userName]="userName()"
  [resultCount]="totalProducts()"
  (searchChanged)="onSearch($event)"
  (navSelected)="onNavSelected($event)"
>
  <div class="tolla-dashboard" [class.tolla-dashboard--edit]="quickEditOpen()">
    <div class="tolla-dashboard__main">
      <section class="tolla-dashboard__section">
        <div class="tolla-dashboard__section-head">
          <h1 class="tolla-dashboard__eyebrow">// TOLLA OVERVIEW</h1>
          <span class="tolla-dashboard__live" aria-hidden="true">
            <span class="tolla-dashboard__live-dot"></span>
            LIVE FEED
          </span>
        </div>
        <tolla-kpi-grid [kpis]="kpis()" />
      </section>

      <section class="tolla-dashboard__section">
        <tolla-ontology-list
          [categories]="categories()"
          [loading]="loadingCategories()"
          (categorySelected)="onCategorySelected($event)"
          (categoryEdit)="onCategoryEdit($event)"
          (createNode)="onCreateNode()"
          (categoryDelete)="onCategoryDelete($event)"
        />
      </section>

      @if (loadingProducts()) {
        <div class="tolla-dashboard__products-loading">SYNCING PRODUCT CATALOG…</div>
      } @else if (products().length === 0) {
        <div class="tolla-dashboard__products-empty">
          No products match the current query.
        </div>
      }
    </div>

    @if (quickEditOpen()) {
      <tolla-quick-edit-panel
        class="tolla-dashboard__panel"
        [mode]="quickEditMode()"
        [category]="selectedCategory()"
        (saved)="onNodeSaved($event)"
        (discard)="onDiscard()"
      />
    }
  </div>
</tolla-layout-container>
